<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>BLOOM Garden</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    body { display: grid; place-items: center; font: 12px/1.3 system-ui, sans-serif; color: #e9e6d6; }
    #window { position: relative; }
    #window canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #window canvas[hidden] { display: none; }
    #gui-toggle { position: fixed; right: 12px; bottom: 12px; width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid #ffffff33; background: #ffffff14; color: inherit; font-size: 17px; cursor: pointer; }
    #gui { position: fixed; left: 12px; top: 12px; width: 220px; max-height: calc(100% - 24px); overflow: auto;
      padding: 12px; border-radius: 12px; background: #11140fe6; border: 1px solid #ffffff22; backdrop-filter: blur(6px); }
    #gui[hidden] { display: none; }
    #gui h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; font-weight: 600; opacity: .6; }
    #gui .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 12px; }
    #gui .styles label { text-align: center; padding: 6px 0; border-radius: 6px; background: #ffffff10; cursor: pointer; }
    #gui .styles input { display: none; }
    #gui .styles label:has(input:checked) { background: #e9e6d6; color: #11140f; }
    #gui .row { display: grid; grid-template-columns: 74px 1fr 30px; align-items: center; gap: 6px; margin: 6px 0; }
    #gui .row output { text-align: right; opacity: .7; font-variant-numeric: tabular-nums; }
    #gui input[type=range] { width: 100%; }
    #gui fieldset { border: 0; border-top: 1px solid #ffffff1c; margin: 10px 0 0; padding: 8px 0 0; }
    #gui legend { padding: 0; opacity: .6; letter-spacing: .1em; font-size: 10px; text-transform: uppercase; }
    #gui button { margin-top: 10px; width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #ffffff33;
      background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="window" aria-label="Garden of past Pond conversations">
    <canvas id="garden"></canvas>
    <canvas id="signal" hidden></canvas>
  </div>

  <button id="gui-toggle" aria-label="Garden style settings" aria-expanded="false">◐</button>
  <form id="gui" hidden>
    <h2>GARDEN STYLE</h2>
    <div class="styles" role="radiogroup" aria-label="Style">
      <label><input type="radio" name="style" value="ink">Ink</label>
      <label><input type="radio" name="style" value="paper">Paper</label>
      <label><input type="radio" name="style" value="signal">Signal</label>
    </div>
    <div class="row"><span>Wind</span><input type="range" name="wind" min="0" max="3" step="0.1"><output></output></div>
    <div class="row"><span>Labels</span><input type="checkbox" name="labels"><span></span></div>
    <fieldset data-style="paper">
      <legend>Watercolour</legend>
      <div class="row"><span>Layers</span><input type="range" name="layers" min="1" max="16" step="1"><output></output></div>
      <div class="row"><span>Opacity %</span><input type="range" name="opacity" min="1" max="20" step="1"><output></output></div>
      <div class="row"><span>Warp</span><input type="range" name="warp" min="0" max="16" step="0.5"><output></output></div>
      <div class="row"><span>Boil fps</span><input type="range" name="boil" min="1" max="12" step="1"><output></output></div>
    </fieldset>
    <fieldset data-style="signal">
      <legend>Shader</legend>
      <div class="row"><span>Pixel</span><input type="range" name="pixel" min="1" max="8" step="0.5"><output></output></div>
      <div class="row"><span>Levels</span><input type="range" name="levels" min="2" max="10" step="1"><output></output></div>
      <div class="row"><span>Glow</span><input type="range" name="glow" min="0" max="2.5" step="0.1"><output></output></div>
      <div class="row"><span>Aberration</span><input type="range" name="aberration" min="0" max="4" step="0.1"><output></output></div>
      <div class="row"><span>Scanlines</span><input type="range" name="scanlines" min="0" max="1" step="0.05"><output></output></div>
    </fieldset>
    <button type="button" id="regrow">Regrow</button>
    <button type="button" id="reset">Reset settings</button>
  </form>

  <script src="/garden-model.js?v=2"></script>
  <script src="/garden-styles.js?v=2"></script>
  <script src="/garden.js?v=2"></script>
</body>
</html>
